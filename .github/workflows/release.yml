name: release

# Push a tag matching the workspace version (Cargo.toml), e.g. `git tag v0.1.0 && git push origin v0.1.0`.
# Builds Windows (portable zip + MSI), Linux (AppImage) and macOS (universal .dmg), then publishes
# one GitHub Release with every file and a SHA256SUMS list.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches Cargo.toml
        if: github.event_name == 'push'
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked -p ve-app --target x86_64-pc-windows-msvc
      - name: Portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path target/x86_64-pc-windows-msvc/release/view-everything.exe `
            -DestinationPath dist/view-everything-windows-x86_64-portable.zip
      - name: Install WiX 3 and cargo-wix
        shell: pwsh
        run: |
          choco install wixtoolset --no-progress -y
          "C:\Program Files (x86)\WiX Toolset v3.14\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          cargo install cargo-wix --locked
      - name: Build MSI
        shell: pwsh
        run: |
          # main.wxs expects the exe at target\release; mirror the msvc output there.
          New-Item -ItemType Directory -Force target/release | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/view-everything.exe target/release/
          cargo wix -p ve-app --include packaging/windows/main.wxs --no-build --nocapture `
            --output dist/view-everything-windows-x86_64.msi
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  linux:
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build dependencies
        run: >
          sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libxkbcommon-x11-dev
          libwayland-dev libxcb1-dev libvulkan-dev libegl1-mesa-dev libfontconfig1-dev libfreetype6-dev
          librsvg2-bin
      - name: Build AppImage
        run: packaging/linux/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  macos:
    needs: version
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Icon tools
        run: brew install librsvg
      - name: Build universal .dmg
        run: packaging/macos/build-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  publish:
    needs: [windows, linux, macos]
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
