[package]
name = "ve-app"
description = "Find files by name and find what is consuming disk space"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "view-everything"
path = "src/main.rs"

[dependencies]
chrono = "0.4.45"
dirs = "7.0.0"
opener = { version = "0.9.0", features = ["reveal"] }
gpui-kit = "0.8.1"
parking_lot = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
trash = "5.2.9"
ve-core = { path = "../ve-core" }
ve-scan = { path = "../ve-scan" }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Shell"] }
