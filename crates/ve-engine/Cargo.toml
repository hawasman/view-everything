[package]
name = "ve-engine"
description = "The view-everything engine: Index, Tasks, Locations, Live updates, Sync scheduling and Snapshots"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Measurement hooks: a synthetic Index's Volume (VE_BENCH_MOUNT) is never synced.
bench = []

[dependencies]
chrono = "0.4.45"
dirs = "7.0.0"
getrandom = "0.3.4"
parking_lot = "0.13.0"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
toml = "1.1.8"
trash = "5.2.9"
ve-core = { path = "../ve-core" }
ve-scan = { path = "../ve-scan" }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3.27.0"
