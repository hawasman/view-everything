[package]
name = "ve-cli"
description = "Command-line access to the view-everything Index: the running app's, or the saved one"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ve"
path = "src/main.rs"

[dependencies]
chrono = "0.4.45"
dirs = "7.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
toml = "1.1.8"
ve-core = { path = "../ve-core" }
ve-engine = { path = "../ve-engine" }

[dev-dependencies]
tempfile = "3.27.0"
ve-scan = { path = "../ve-scan" }
